name: Brand Home apply

on:
  push:
    branches:
      - brand-home
    paths:
      - scripts/apply-brand-home.mjs

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply bounded App patch
        run: node scripts/apply-brand-home.mjs
      - name: Remove temporary patch machinery
        run: rm scripts/apply-brand-home.mjs .github/workflows/brand-home-apply.yml
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit verified implementation
        run: |
          git config user.name "madowaku"
          git config user.email "67355875+madowaku@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Picture Score Home and official brand"
          git push origin HEAD:brand-home
