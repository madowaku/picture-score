name: CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  browser-qa:
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright CLI and browser
        run: |
          npm install --global @playwright/cli@0.1.19
          playwright-cli install-browser --with-deps

      - name: Start Vite
        run: |
          mkdir -p output/playwright
          npm run dev -- --host 127.0.0.1 > /tmp/picture-score-vite.log 2>&1 &

      - name: Wait for Vite
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/picture-score-vite.log
          exit 1

      - name: Open browser session
        run: playwright-cli -s=release open http://127.0.0.1:5173

      - name: Verify SCORE BLOOM
        run: playwright-cli -s=release run-code --filename scripts/verify-score-bloom.cjs

      - name: Verify Core Meaning
        run: playwright-cli -s=release run-code --filename scripts/verify-core-meaning.cjs

      - name: Verify Creator Palette
        run: playwright-cli -s=release run-code --filename scripts/verify-creator-palette.cjs

      - name: Regress CLEARING
        run: playwright-cli -s=release run-code --filename scripts/verify-clearing.cjs

      - name: Regress WEAVE
        run: playwright-cli -s=release run-code --filename scripts/verify-weave.cjs

      - name: Regress ALIVE and WONDER
        run: playwright-cli -s=release run-code --filename scripts/verify-alive-wonder.cjs

      - name: Close browser session
        if: always()
        run: playwright-cli -s=release close || true

      - name: Upload browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: score-bloom-browser-qa
          path: output/playwright
          if-no-files-found: warn
