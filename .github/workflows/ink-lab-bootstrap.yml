name: INK LAB bootstrap

on:
  push:
    branches:
      - ink-lab-renderer
    paths:
      - scripts/apply-ink-lab.mjs

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ink-lab-renderer

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install existing dependencies
        run: npm ci

      - name: Add perfect-freehand
        run: npm install perfect-freehand@1.2.3 --save

      - name: Apply INK LAB implementation
        run: node scripts/apply-ink-lab.mjs

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/styles.css src/drawing package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "feat: add INK LAB renderer comparison"
          git push origin HEAD:ink-lab-renderer
